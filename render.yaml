services:
  - type: web
    name: sistema-facturacion
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: ""
      - key: APP_URL
        value: https://sistema-facturacion.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: sistema-facturacion-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sistema-facturacion-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: sistema-facturacion-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sistema-facturacion-db
          property: username
      - key: DB_PASSWORD
        fromDatabase:
          name: sistema-facturacion-db
          property: password
      - key: CACHE_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: database

databases:
  - name: sistema-facturacion-db
    plan: free
    databaseName: facturacion
    user: facturacion_user
