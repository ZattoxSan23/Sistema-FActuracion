services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facturacion-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - facturacion-net
    depends_on:
      - db

  webserver:
    image: nginx:1.25-alpine
    container_name: facturacion-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - facturacion-net
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: facturacion-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: facturacion
      POSTGRES_USER: facturacion_user
      POSTGRES_PASSWORD: facturacion_pass
      POSTGRES_ROOT_PASSWORD: root_pass
      PGPASSWORD: facturacion_pass
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - facturacion-net

  redis:
    image: redis:7-alpine
    container_name: facturacion-redis
    restart: unless-stopped
    networks:
      - facturacion-net

networks:
  facturacion-net:
    driver: bridge

volumes:
  dbdata:
    driver: local
